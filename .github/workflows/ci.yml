name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pyyaml
      - run: python -m pytest tests -q
      - run: python -c 'from dify_plugin.config.config import DifyPluginEnv; from dify_plugin.core.plugin_registration import PluginRegistration; PluginRegistration(DifyPluginEnv())'
