identity:
  author: serpkite
  name: chatgpt
  label:
    en_US: Ask ChatGPT
description:
  human:
    en_US: 'Ask ChatGPT as a logged-out visitor (searching the web by default) and get its answer with the sources it cited and the products and places it showed. Usually takes 10–30 s. Pricing: https://serpkite.com/pricing;
      failed and empty requests are not billed.'
  llm: Ask ChatGPT as a logged-out visitor (searching the web by default) and get its answer with the sources it cited and the products and places it showed. Use it to see what ChatGPT tells people (AI
    visibility) or for a second opinion. Takes 10–30 s. If it reports that the answer is still being finished, call it again with the same prompt within 10 minutes to receive it (not billed twice).
parameters:
- name: prompt
  type: string
  required: true
  label:
    en_US: Prompt
  human_description:
    en_US: The message to ChatGPT, up to 4,000 characters.
  form: llm
  llm_description: The question or message to send to ChatGPT, up to 4,000 characters.
- name: country
  type: string
  required: false
  label:
    en_US: Country
  human_description:
    en_US: Ask from this country (two-letter code); answers, prices and shops follow it.
  form: llm
  llm_description: Optional two-letter country code to ask from, e.g. us, de, gb.
- name: web_search
  type: boolean
  required: false
  label:
    en_US: Web Search
  human_description:
    en_US: Make ChatGPT search the web (default true); false lets it decide.
  form: llm
  llm_description: Optional. true (default) makes ChatGPT search the web; false lets it decide.
- name: track
  type: string
  required: false
  label:
    en_US: Track
  human_description:
    en_US: Comma-separated brands or domains to check the answer for (up to 20).
  form: llm
  llm_description: Optional comma-separated brands or domains to check whether the answer names or cites them (up to 20).
- name: output
  type: select
  required: false
  label:
    en_US: Output
  human_description:
    en_US: markdown returns readable Markdown for agents; json returns the full JSON response for workflows, plus a short Markdown summary.
  form: form
  default: markdown
  options:
  - value: markdown
    label:
      en_US: markdown
  - value: json
    label:
      en_US: json
extra:
  python:
    source: tools/chatgpt.py
