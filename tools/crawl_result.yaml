identity:
  author: serpkite
  name: crawl_result
  label:
    en_US: Get Crawl Result
description:
  human:
    en_US: Get the status or the pages of a crawl started with Start Site Crawl, waiting for it to finish if needed. Free.
  llm: Get the status or the pages of a crawl started with Start Site Crawl. Waits up to wait_seconds for it to finish.
parameters:
- name: id
  type: string
  required: true
  label:
    en_US: Task ID
  human_description:
    en_US: The task id returned when the task was started.
  form: llm
  llm_description: The task id returned when the task was started.
- name: wait_seconds
  type: number
  required: false
  label:
    en_US: Wait (seconds)
  human_description:
    en_US: How long to wait for the task to finish before returning its current status (0 to 240).
  form: form
  default: 60
  min: 0
  max: 240
extra:
  python:
    source: tools/crawl_result.py
